[package]
name = "higgins"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE.md"

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
arrow-json = { workspace = true }
async-trait = "0.1.88"
bytes = "1.10.1"
clap = {workspace = true}
riskless = "0.7.3"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.5"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3.19"
uuid = { version = "1.16.0", features = ["v4"] }
object_store = {version = "0.12", features = ["aws", "azure", "gcp"]}

# Higgins
higgins-codec = { path = "../higgins-codec" }
higgins-functions = { path = "../higgins-functions" }
prost = "0.13.5"
thiserror = "2.0.12"
rkyv = "0.8.10"
memmap2 = "0.9.8"
zerocopy = { version = "0.8.27", features = ["derive"] }
rand = "0.9.2"
futures = "0.3.31"
higgins-shared = { path = "../higgins-shared" }
serde_json = "1.0.140"
nom = "8.0.0"

[dev-dependencies]
higgins-client = { path = "../higgins-client" }
get-port = "4.0.0"
tempfile = "3.10"
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }
loom = { version = "0.7.2", features = ["futures"] }
serde_json = "1.0.140"
colored = "3.0.0"
